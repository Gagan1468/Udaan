<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Udaan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; font-family:Arial, sans-serif; }
header {
  background:#0b1c2d;
  color:white;
  padding:15px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
a { color:white; text-decoration:none; margin-left:15px; }
main { padding:40px; }
</style>
</head>

<body>

<header>
  <strong>Udaan</strong>

  <!-- GUEST -->
  <div id="guestNav">
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
  </div>

  <!-- USER -->
  <div id="userNav" style="display:none;">
    <a href="#">Profile</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>
</header>

<main>
  <h1>Welcome to Udaan</h1>
  <p>Session-based authentication working.</p>
</main>

<script>
async function checkAuth() {
  try {
    const res = await fetch("http://localhost:3000/api/auth/status", {
      credentials: "include"
    });
    const data = await res.json();

    document.getElementById("guestNav").style.display =
      data.loggedIn ? "none" : "block";
    document.getElementById("userNav").style.display =
      data.loggedIn ? "block" : "none";

  } catch (e) {
    console.error("Auth check failed");
  }
}

function logout() {
  fetch("http://localhost:3000/api/auth/logout", {
    method: "POST",
    credentials: "include"
  }).then(() => location.reload());
}

window.onload = checkAuth;
</script>

</body>
</html>
