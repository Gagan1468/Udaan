<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – Udaan</title>

  <!-- Poppins font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    body {
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      background: url('https://images.unsplash.com/photo-1508780709619-79562169bc64')
        no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.98);
      padding: 36px;
      border-radius: 18px;
      width: 420px;
      max-width: calc(100% - 40px);
      box-shadow: 0 4px 12px rgba(60,64,67,0.12),
                  0 8px 24px rgba(60,64,67,0.06);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 18px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      font-size: 15px;
      font-weight: 600;
    }

    button {
      margin-top: 18px;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: #1a73e8;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="login-box">
  <h2>Login to Udaan</h2>

  <input type="email" id="loginEmail" placeholder="Email Address" required>
  <input type="password" id="loginPassword" placeholder="Password" required>

  <button onclick="loginUser()">Login</button>
</div>

<script>
  function loginUser() {
    const email = loginEmail.value.trim().toLowerCase();
    const password = loginPassword.value.trim();

    if (!email || !password) {
      alert('Please enter both email and password.');
      return;
    }

    fetch('http://localhost:3000/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    })
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        localStorage.setItem('prernaLoggedIn', 'true');
        localStorage.setItem('prernaEmail', data.user.email);
        localStorage.setItem('prernaName', data.user.name);
        localStorage.setItem('prernaPhone', data.user.phone || '');
        localStorage.setItem('prernaPhoto', data.user.photo || '');

        alert('Login successful!');
        window.location.href = 'index.html';
      } else {
        alert(data.message || 'Login failed.');
      }
    })
    .catch(() => alert('Backend server not running.'));
  }

  loginPassword.addEventListener('keydown', e => {
    if (e.key === 'Enter') loginUser();
  });
</script>

</body>
</html>
