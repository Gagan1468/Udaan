<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – Prerna</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: url('https://images.unsplash.com/photo-1508780709619-79562169bc64') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      width: 360px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      width: 100%;
      border: none;
      border-radius: 6px;
      background: #673ab7;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #5e35b1;
    }
    .forgot-btn {
      margin-top: 10px;
      background: transparent;
      color: #673ab7;
      text-decoration: underline;
    }
    .forgot-btn:hover {
      color: #5e35b1;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Login to Prerna</h2>
    <input type="email" id="loginEmail" placeholder="Email Address" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button onclick="loginUser()">Login</button>
    <button class="forgot-btn" onclick="forgotPassword()">Forgot Password?</button>
  </div>

  <script>
    function loginUser() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    if(!email || !password) {
        alert("Please fill in all fields.");
        return;
    }

    fetch('http://localhost:3000/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
    })
    .then(res => res.json())
    .then(data => {
        if(data.success) {
            // Save session info in localStorage if needed
            localStorage.setItem('prernaLoggedIn', 'true');
            localStorage.setItem('prernaEmail', data.user.email);
            localStorage.setItem('prernaName', data.user.name);
            localStorage.setItem('prernaPhone', data.user.phone);
            localStorage.setItem('prernaPhoto', data.user.photo);

            alert("Login successful!");
            window.location.href = "D:/Udaan/index.html";  // redirect to homepage
        } else {
            alert(data.message);
        }
    })
    .catch(err => {
        console.error(err);
        alert("Something went wrong. Try again.");
    });
}

function forgotPassword() {
    const email = prompt("Enter your registered email to reset password:");
    if(!email) return;

    const newPassword = prompt("Enter your new password:");
    if(!newPassword) return;

    fetch('http://localhost:3000/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, newPassword })
    })
    .then(res => res.json())
    .then(data => {
        if(data.success) {
            alert("Password updated successfully! You can now login with your new password.");
        } else {
            alert(data.message);
        }
    })
    .catch(err => {
        console.error(err);
        alert("Something went wrong. Try again.");
    });
}

  </script>

</body>
</html>
