<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – Udaan</title>

  <!-- Poppins font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      background: url('https://images.unsplash.com/photo-1508780709619-79562169bc64') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* Card */
    .login-box {
      background: rgba(255, 255, 255, 0.98);
      padding: 36px;
      border-radius: 18px;
      box-shadow: 0 4px 12px rgba(60,64,67,0.12), 0 8px 24px rgba(60,64,67,0.06);
      width: 420px;
      max-width: calc(100% - 40px);
      border: none;
      outline: none;
    }

    /* Centered title */
    .login-box h2 {
      text-align: center;
      margin: 0 0 18px 0;
      font-weight: 700;
      color: #202124;
      font-size: 1.3rem;
      letter-spacing: 0.2px;
    }

    /* Inputs (bolder text inside) */
    input {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      background: #fff;
      box-shadow: none;
      outline: none;
      -webkit-appearance: none;
      font-size: 15px;
      font-weight: 600;
      color: #202124;
    }
    input::placeholder { font-weight: 500; color: #9aa0a6; }
    input:focus {
      border-color: #cfd8dc;
      box-shadow: 0 1px 2px rgba(60,64,67,0.06);
      outline: none;
    }

    /* Button */
    button {
      margin-top: 18px;
      padding: 12px 20px;
      width: 100%;
      border: none;
      border-radius: 12px;
      background: #1a73e8;
      color: white;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      box-shadow: 0 6px 14px rgba(26,115,232,0.18);
      transition: transform 180ms ease, background-color 220ms ease, box-shadow 180ms ease, letter-spacing 180ms ease;
      letter-spacing: 0.2px;
      transform: translateY(0) scale(1);
    }
    button:hover {
      background: #34A853;
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 14px 28px rgba(52,168,83,0.16);
      letter-spacing: 0.9px;
    }
    button:active {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 18px rgba(52,168,83,0.14);
    }
    button:focus { outline: none; box-shadow: 0 6px 14px rgba(26,115,232,0.12); }

    /* Responsive tweaks */
    @media (max-width: 420px) {
      .login-box { width: calc(100% - 28px); padding: 24px; }
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Login to Udaan</h2>
    <input type="email" id="loginEmail" placeholder="Email Address" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button onclick="loginUser()">Login</button>
  </div>

  <script>
function loginUser() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value.trim();

  if (!email || !password) {
    alert("Enter email & password");
    return;
  }

  fetch('http://localhost:3000/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include', // 🔥 VERY IMPORTANT
    body: JSON.stringify({ email, password })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      alert("Login successful");
      window.location.href = "index.html";
    } else {
      alert(data.msg || "Invalid credentials");
    }
  })
  .catch(() => alert("Backend not responding"));
}
    // Allow Enter key to submit
    document.getElementById('loginPassword').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') loginUser();
    });
  </script>

</body>
</html>
