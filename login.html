<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – Prerna</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: url('https://images.unsplash.com/photo-1508780709619-79562169bc64') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      width: 360px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      width: 100%;
      border: none;
      border-radius: 6px;
      background: #673ab7;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #5e35b1;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Login to Prerna</h2>
    <input type="email" id="loginEmail" placeholder="Email Address" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button onclick="loginUser()">Login</button>
  </div>

  <script>
    function loginUser() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!email || !password) {
        alert("Please fill in all fields.");
        return;
      }

      const storedUser = localStorage.getItem(email);
      if (!storedUser) {
        alert("No user found with this email. Please register first.");
        return;
      }

      const user = JSON.parse(storedUser);
      if (user.password !== password) {
        alert("Incorrect password. Try again.");
        return;
      }

      // Login success: save to session
      localStorage.setItem('prernaLoggedIn', 'true');
      localStorage.setItem('prernaEmail', user.email);
      localStorage.setItem('prernaName', user.name);
      localStorage.setItem('prernaPhone', user.phone);
      localStorage.setItem('prernaPhoto', user.photo);

      alert("Login successful!");
      window.location.href = "index.html"; // redirect to homepage
    }
  </script>

</body>
</html>
