<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile – Prerna</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #673ab7;
      --primary-dark: #4527a0;
      --secondary: #6dd5ed;
      --danger: #e53935;
      --back1: #e0c3fc;
      --back2: #8ec5fc;
      --container-bg: #fff;
      --shadow: 0 6px 32px rgba(103,58,183,0.09);
      --text-main: #2a2e39;
      --text-subtle: #8e94a3;
      --button-hover: #5e35b1;
      --button-edit: #ecb747;
    }
    [data-theme='dark'] {
      --primary: #9568f7;
      --primary-dark: #362255;
      --secondary: #0a4350;
      --danger: #ea6d7f;
      --back1: #1a1630;
      --back2: #192239;
      --container-bg: #232244;
      --shadow: 0 6px 32px rgba(30,22,56,0.22);
      --text-main: #f3f3fa;
      --text-subtle: #bcb9d4;
      --button-hover: #483175;
      --button-edit: #f3d392;
    }
    body {
      background: linear-gradient(120deg, var(--back1), var(--back2));
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      min-height: 100vh;
      color: var(--text-main);
      transition: background 0.5s, color 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .theme-switcher {
      position: fixed; right: 32px; top: 28px;
      background: var(--container-bg);
      color: var(--primary);
      border: none;
      box-shadow: var(--shadow);
      border-radius: 50px;
      font-size: 1.15rem;
      padding: 7px 19px;
      cursor: pointer;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 9px;
      transition: background 0.2s, color 0.2s;
    }
    .theme-switcher:hover { background: var(--primary); color: #fff; }
    .profile-card {
      background: var(--container-bg);
      padding: 42px 32px 32px 32px;
      border-radius: 18px;
      box-shadow: var(--shadow);
      width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeInUp 0.7s;
      position: relative;
      transition: background 0.3s, color 0.3s, box-shadow 0.3s;
    }
    .profile-avatar {
      width: 110px;
      height:110px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 2px 10px rgba(103,58,183,.11);
      margin-bottom: 18px;
      background: #ede7f6;
      border: 3.5px solid var(--primary);
      transition: border 0.3s;
    }
    .profile-card h2 {
      margin: 0 0 6px 0;
      font-size: 1.36rem;
      letter-spacing: 0.2px;
    }
    .profile-badge {
      font-size: 0.98rem;
      color: var(--primary-dark);
      display: inline-block;
      padding: 2.5px 14px;
      background: linear-gradient(90deg,#ede7f6,#e0c3fc9c);
      border-radius: 8px;
      margin-bottom: 13px;
    }
    [data-theme='dark'] .profile-badge { background: #292456a6; color: var(--primary); }
    .profile-card p {
      color: var(--text-subtle);
      margin: 0 0 18px 0;
      font-size: 1.09rem;
      letter-spacing: 0.1px;
    }
    .profile-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 8px;
      width: 100%;
    }
    .profile-actions button {
      flex:1;
      padding: 12px 0;
      border-radius: 8px;
      border: none;
      font-size: 1.04rem;
      font-weight: 500;
      cursor: pointer;
      margin: 0 4px;
      transition: background 0.2s, color 0.18s, box-shadow 0.18s;
      box-shadow: 0 1px 7px rgba(120, 95, 165, 0.05);
    }
    .profile-actions .edit-btn {
      background: var(--button-edit);
      color: #5d4b05;
    }
    .profile-actions .edit-btn:hover {
      background: #ffe09c;
      color: #222;
    }
    .profile-actions .back-btn {
      background: var(--primary);
      color: #fff;
    }
    .profile-actions .back-btn:hover {
      background: var(--button-hover);
      color: #fff;
    }
    .profile-actions .logout-btn{
      background: var(--danger);
      color: #fff;
    }
    .profile-actions .logout-btn:hover{
      background: #c62828;
      color: #fff;
    }
    @media (max-width:600px){
      .profile-card{ width:95vw; padding:28px 4vw; }
      .theme-switcher{ top: 7px; right:7px; font-size:.99rem; }
    }
    @keyframes fadeInUp {
      from {opacity:0; transform: translateY(26px);}
      to {opacity:1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <button class="theme-switcher" id="themeBtn" title="Toggle light/dark mode" onclick="toggleTheme()">
    <i class="fas fa-moon" id="themeIcon"></i> Theme
  </button>
  <div class="profile-card">
    <img id="userPhoto" class="profile-avatar" src="https://i.ibb.co/3rkfKQg/user-default.png" alt="User">
    <h2 id="userName">Loading...</h2>
    <div class="profile-badge" id="userEmail">Loading...</div>
    <p id="userRole">Member</p>
    <div class="profile-actions">
      <button class="back-btn" onclick="goBack()"><i class="fas fa-home"></i> Home</button>
      <button class="edit-btn" onclick="goToEdit()"><i class="fas fa-user-edit"></i> Edit</button>
      <button class="logout-btn" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </div>
  <script>
    // THEME HANDLING
    function setTheme(theme){
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('prerna-theme', theme);
      document.getElementById('themeIcon').className =
        theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }
    function toggleTheme(){
      const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(theme);
    }
    (function(){
      const saved = localStorage.getItem('prerna-theme');
      if(saved) setTheme(saved);
      else if(window.matchMedia('(prefers-color-scheme: dark)').matches) setTheme('dark');
      else setTheme('light');
    })();

    // PROFILE DATA FROM BACKEND (replace endpoint as needed)
    async function loadProfile() {
      try {
        const response = await fetch('/api/get-profile', { credentials: 'include' });
        if (!response.ok) throw new Error('User data not found');
        const data = await response.json();
        document.getElementById('userName').innerText = data.name || 'Unknown User';
        document.getElementById('userEmail').innerText = data.email || 'No email found';
        if (data.photo) {
          document.getElementById('userPhoto').src = data.photo;
        }
        document.getElementById('userRole').innerText = data.role ? data.role : "Member";
      } catch (err) {
        alert('User data not found');
        window.location.href = 'login.html';
      }
    }
    loadProfile();

    function goBack() {
      window.location.href = "index.html";
    }
    function goToEdit() {
      window.location.href = "editprofile.html";
    }
    function logoutUser() {
      fetch('/api/logout', { method: 'POST', credentials: 'include' }).finally(() => {
        window.location.href = "login.html";
      });
    }
  </script>
</body>
</html>
