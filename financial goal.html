<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Goal Planner – Udaan</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e3f2fd, #ffffff);
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #1e88e5;
      color: white;
      text-align: center;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    h1 {
      margin: 0;
      font-size: 2.4rem;
    }

    p {
      margin: 10px 0;
      font-size: 1.1rem;
    }

    .planner-box {
      background: white;
      max-width: 700px;
      margin: 40px auto;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 0 15px rgba(0,0,0,0.15);
    }

    .planner-box h2 {
      text-align: center;
      color: #1565c0;
      margin-bottom: 20px;
    }

    .planner-box label {
      font-weight: 600;
      display: block;
      margin-top: 12px;
      color: #333;
    }

    .planner-box input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      background-color: #1e88e5;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
      transition: 0.3s;
    }

    button:hover {
      background-color: #1565c0;
    }

    .result {
      margin-top: 25px;
      background: #f0f7ff;
      border-radius: 10px;
      padding: 20px;
      color: #0d47a1;
    }

    .tips {
      margin-top: 20px;
      background: #fffde7;
      border-left: 5px solid #ffeb3b;
      padding: 15px;
      border-radius: 8px;
    }

    .tips h3 {
      margin-top: 0;
      color: #f57f17;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #888;
      font-size: 14px;
      padding: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Financial Goal Planner</h1>
    <p>Plan, Save & Achieve Your Dreams 💰</p>
  </header>

  <div class="planner-box">
    <h2>Set Your Financial Goals</h2>

    <label>Current Age:</label>
    <input type="number" id="age" placeholder="Enter your age">

    <label>Monthly Income (₹):</label>
    <input type="number" id="income" placeholder="Enter your monthly income">

    <label>Current Monthly Savings (₹):</label>
    <input type="number" id="savings" placeholder="Enter your current savings">

    <label>Target Retirement Amount (₹):</label>
    <input type="number" id="target" placeholder="Enter your retirement goal amount">

    <label>Target Age (for goal):</label>
    <input type="number" id="retirementAge" placeholder="Enter target age (like 60)">

    <button onclick="calculateGoal()">Plan My Future 🚀</button>

    <div id="result" class="result"></div>
    <div id="tips" class="tips"></div>
  </div>

  <footer>
    &copy; 2025 Udaan | Powered by Atal Technologies Pvt. Ltd. 💼
  </footer>

  <script>
    function calculateGoal() {
      let age = parseInt(document.getElementById('age').value);
      let income = parseInt(document.getElementById('income').value);
      let savings = parseInt(document.getElementById('savings').value);
      let target = parseInt(document.getElementById('target').value);
      let retirementAge = parseInt(document.getElementById('retirementAge').value);

      if (isNaN(age) || isNaN(income) || isNaN(savings) || isNaN(target) || isNaN(retirementAge)) {
        alert("Please fill all the fields properly!");
        return;
      }

      let yearsLeft = retirementAge - age;
      let annualSavings = savings * 12;
      let totalSaved = annualSavings * yearsLeft;
      let requiredGrowth = target - totalSaved;

      let message = "";
      let tipsList = [];

      if (requiredGrowth <= 0) {
        message = `🎉 Great job! You’re already on track to reach ₹${target} by age ${retirementAge}.`;
        tipsList.push("Keep investing your savings for better returns.");
        tipsList.push("Avoid unnecessary lifestyle inflation.");
      } else {
        let extra = Math.round(requiredGrowth / (yearsLeft * 12));
        message = `To reach ₹${target} by age ${retirementAge}, you need to save an extra ₹${extra} per month.`;
        if (extra > income * 0.2) {
          tipsList.push("Try increasing income sources or investing smartly.");
        }
        if (savings < income * 0.1) {
          tipsList.push("Try saving at least 10% of your income every month.");
        }
        tipsList.push("Invest in mutual funds or SIPs for compounding growth.");
        tipsList.push("Avoid debt-based expenses and focus on emergency funds.");
      }

      document.getElementById('result').innerHTML = `
        <h3>📊 Financial Summary</h3>
        <p><strong>Years Left:</strong> ${yearsLeft}</p>
        <p><strong>Total Savings (Current Rate):</strong> ₹${totalSaved.toLocaleString()}</p>
        <p>${message}</p>
      `;

      document.getElementById('tips').innerHTML = `
        <h3>💡 Tips to Improve:</h3>
        <ul>${tipsList.map(t => `<li>${t}</li>`).join('')}</ul>
      `;
    }
  </script>

</body>
</html>
