<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Goal Planner</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #f3f6f9; margin: 0; padding: 20px; }
  .goal-section { max-width: 650px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 0 12px rgba(0,0,0,0.1); }
  .goal-section h2 { text-align: center; color: #0d47a1; margin-bottom: 20px; }
  .goal-section input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; }
  .goal-section button { width: 100%; padding: 12px; background-color: #1e88e5; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
  .goal-section button:hover { background-color: #1565c0; }
  .result-box { background: #e3f2fd; padding: 20px; border-radius: 8px; margin-top: 15px; color: #0d47a1; font-weight: 600; }
  .result-box ul { margin-top: 5px; padding-left: 20px; }
</style>
</head>
<body>

<section class="goal-section">
  <h2>Financial Goal Planner</h2>
  <input type="number" id="targetAmount" placeholder="Enter your financial goal (₹)">
  <input type="number" id="years" placeholder="In how many years?">
  <input type="number" id="currentSavings" placeholder="Current savings (₹)">
  <input type="number" id="monthlySave" placeholder="Monthly saving (optional)">
  <button onclick="planGoal()">Calculate Plan</button>
  <div id="goalResult" class="result-box"></div>
</section>

<script>
function planGoal() {
  const target = parseFloat(document.getElementById("targetAmount").value);
  const years = parseFloat(document.getElementById("years").value);
  const current = parseFloat(document.getElementById("currentSavings").value);
  let monthly = parseFloat(document.getElementById("monthlySave").value) || 0;

  // Assuming a realistic expected return based on fund type
  const rate = 0.12 / 12; // 12% annual, monthly compounded
  const months = years * 12;

  // Calculate required monthly SIP if user left it blank
  if(monthly === 0){
    monthly = (target - current * Math.pow(1 + rate, months)) / ((Math.pow(1 + rate, months) - 1)/rate);
  }

  // Future value projection
  const futureValue = current * Math.pow(1 + rate, months) + monthly * ((Math.pow(1 + rate, months) - 1)/rate);

  // Mutual funds recommendations based on past 5-year CAGR (example)
  const funds = [
    {name: "Motilal Oswal Midcap Fund", cagr: 35.16},
    {name: "Quant Small Cap Fund", cagr: 31.48},
    {name: "HDFC Mid Cap Fund", cagr: 30.83},
    {name: "ICICI Prudential Retirement Fund", cagr: 29.67}
  ];

  let fundList = "<ul>";
  funds.forEach(f => {
    fundList += `<li>${f.name} – ${f.cagr}% CAGR (last 5 years)</li>`;
  });
  fundList += "</ul>";

  // Tips & tricks
  const tips = `
    <ul>
      <li>Start SIP as early as possible – time in the market beats timing.</li>
      <li>Increase SIP by ~10% annually as your income grows.</li>
      <li>Prioritize debt repayment before investing heavily.</li>
      <li>Diversify across equity, debt, and mid/small-cap funds.</li>
      <li>Review your portfolio yearly and rebalance if necessary.</li>
      <li>Track monthly expenses to save more efficiently.</li>
    </ul>
  `;

  let result = `
    🎯 <b>Goal:</b> ₹${target.toLocaleString()} in ${years} years.<br>
    💵 <b>Suggested Monthly SIP:</b> ₹${monthly.toFixed(2)}<br>
    💰 <b>Projected Future Value:</b> ₹${futureValue.toFixed(2)}<br><br>
    <b>Recommended Mutual Funds (Past 5-Year Performance):</b> ${fundList}
    <b>Actionable Tips & Tricks:</b> ${tips}
  `;

  document.getElementById("goalResult").innerHTML = result;
}
</script>

</body>
</html>
