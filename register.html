<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register – Prerna</title>

  <!-- Poppins font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      background: url('https://images.unsplash.com/photo-1508780709619-79562169bc64') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* Card */
    .register-box {
      background: rgba(255, 255, 255, 0.98);
      padding: 36px;
      border-radius: 18px;
      box-shadow: 0 4px 12px rgba(60,64,67,0.12), 0 8px 24px rgba(60,64,67,0.06);
      width: 420px;
      max-width: calc(100% - 40px);
      border: none;
      outline: none;
    }

    /* Centered title */
    .register-box h2 {
      text-align: center;
      margin: 0 0 18px 0;
      font-weight: 700;
      color: #202124;
      font-size: 1.3rem;
      letter-spacing: 0.2px;
    }

    /* Inputs (bolder text inside) */
    input {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      background: #fff;
      box-shadow: none;
      outline: none;
      -webkit-appearance: none;
      font-size: 15px;
      font-weight: 600;
      color: #202124;
    }
    input::placeholder { font-weight: 500; color: #9aa0a6; }
    input:focus {
      border-color: #cfd8dc;
      box-shadow: 0 1px 2px rgba(60,64,67,0.06);
      outline: none;
    }

    /* Checkbox / no-phone UI */
    .no-phone {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      color: #444;
      font-size: 0.95rem;
      user-select: none;
    }
    .no-phone input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #1a73e8;
      cursor: pointer;
    }
    .phone-tick {
      display: none;
      margin-top: 12px;
      width: 56px;
      height: 40px;
      border-radius: 12px;
      background: rgba(26,115,232,0.08);
      color: #1a73e8;
      font-weight: 700;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(26,115,232,0.06);
      font-size: 1.05rem;
    }

    /* Button */
    button {
      margin-top: 18px;
      padding: 12px 20px;
      width: 100%;
      border: none;
      border-radius: 20px;
      background: #1a73e8;
      color: white;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      box-shadow: 0 6px 14px rgba(26,115,232,0.18);
      transition: transform 180ms ease, background-color 220ms ease, box-shadow 180ms ease, letter-spacing 180ms ease;
      letter-spacing: 0.2px;
      transform: translateY(0) scale(1);
    }
    button:hover {
      background: #34A853;
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 14px 28px rgba(52,168,83,0.16);
      letter-spacing: 0.9px;
    }
    button:active {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 8px 18px rgba(52,168,83,0.14);
    }
    button:focus { outline: none; box-shadow: 0 6px 14px rgba(26,115,232,0.12); }

    /* Responsive tweaks */
    @media (max-width: 420px) {
      .register-box { width: calc(100% - 28px); padding: 24px; }
    }
  </style>
</head>
<body>

  <div class="register-box">
    <h2>Register for Prerna</h2>
    <input type="text" id="regName" placeholder="Full Name" required>
    <input type="email" id="regEmail" placeholder="Email Address" required>

    <!-- Phone input + no-phone checkbox -->
    <input type="tel" id="regPhone" placeholder="Phone Number" required>
    <label class="no-phone">
      <input type="checkbox" id="noPhoneCheckbox" aria-controls="regPhone phoneTick">
      I don't have a phone number
    </label>
    <div id="phoneTick" class="phone-tick" aria-hidden="true">✓</div>

    <input type="password" id="regPassword" placeholder="Password" required>
    <button onclick="registerUser()">Register</button>
  </div>

  <script>
    // Toggle phone input / tick when checkbox changes
    const noPhoneCheckbox = document.getElementById('noPhoneCheckbox');
    const regPhone = document.getElementById('regPhone');
    const phoneTick = document.getElementById('phoneTick');

    noPhoneCheckbox.addEventListener('change', () => {
      if (noPhoneCheckbox.checked) {
        // hide phone input and show tick
        regPhone.dataset.prevValue = regPhone.value || '';
        regPhone.value = '';
        regPhone.style.display = 'none';
        phoneTick.style.display = 'flex';
        regPhone.removeAttribute('required');
      } else {
        // show phone input and remove tick
        regPhone.style.display = '';
        phoneTick.style.display = 'none';
        if (regPhone.dataset.prevValue) regPhone.value = regPhone.dataset.prevValue;
        regPhone.setAttribute('required', 'required');
      }
    });

    // BACKEND API CALL FOR REGISTRATION
    function registerUser() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const noPhone = document.getElementById('noPhoneCheckbox').checked;

      if (!name || !email || (!phone && !noPhone) || !password) {
        alert('Please fill in all required fields.');
        return;
      }

      // Send data to backend API
      fetch('http://localhost:3000/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          name, 
          email, 
          phone: noPhone ? "" : phone, 
          password 
        })
      })
      .then(res => res.json())
      .then(data => {
        console.log('Register Response:', data);
        
        if(data.success) {
          alert(data.message || "Registration successful! Please login.");
          window.location.href = "login.html";
        } else {
          alert(data.message || 'Registration failed.');
        }
      })
      .catch(err => {
        console.error('Registration Error:', err);
        alert("Registration failed! Make sure backend server is running.");
      });
    }
  </script>

</body>
</html>
