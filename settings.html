<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings – Prerna</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #673ab7;
      --danger: #e53935;
      --bg-light: #f6f8fc;
      --container-bg: #fff;
      --shadow: 0 0 18px rgba(70,64,94,0.07);
      --text: #222;
      --grey: #7f8c8d;
      --option-hover: #f3f0fb;
    }
    [data-theme='dark'] {
      --primary: #a491fb;
      --danger: #e57373;
      --bg-light: #1a1930;
      --container-bg: #232244;
      --shadow: 0 0 16px rgba(51,43,80,0.2);
      --text: #f4f8fb;
      --grey: #aaa;
      --option-hover: #28274e;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg-light);
      color: var(--text);
      margin: 0; padding: 0;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    .theme-switcher {
      position: fixed;
      right: 24px;
      top: 24px;
      background: var(--container-bg);
      color: var(--primary);
      border: none;
      box-shadow: var(--shadow);
      border-radius: 50px;
      font-size: 1.25rem;
      padding: 8px 18px 8px 18px;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s, color 0.2s;
    }
    .theme-switcher:hover {
      background: var(--option-hover);
    }

    .container {
      max-width: 440px;
      margin: 60px auto 0 auto;
      background: var(--container-bg);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 38px 26px 26px 26px;
      animation: fadeInUp 0.6s;
      transition: background 0.3s, box-shadow 0.3s;
    }

    h2 {
      text-align: center;
      margin-bottom: 32px;
      color: var(--primary);
      letter-spacing: 1px;
    }

    .setting-option {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 15px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      background: transparent;
      color: var(--text);
      text-decoration: none;
      font-size: 1.08rem;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: background 0.18s, color 0.2s;
      gap: 16px;
      box-sizing: border-box;
    }

    .setting-option:visited { color: var(--text); }

    .setting-option i {
      font-size: 1.32em;
      min-width: 25px;
      color: var(--primary);
      transition: color 0.2s;
    }

    .setting-option:hover, .setting-option:focus {
      background: var(--option-hover);
      color: var(--primary);
      outline: none;
    }
    .setting-option:hover i, .setting-option:focus i {
      color: var(--primary);
    }

    .back-btn {
      margin-top: 30px;
      text-align: center;
      color: var(--primary);
      text-decoration: underline;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.1px;
    }
    .back-btn:hover { color: #492e72; }

    .about-popup {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: var(--container-bg);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 32px 18px 22px 18px;
      width: 325px;
      text-align: center;
      z-index: 1001;
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }
    .about-popup h3 { margin-bottom: 12px; color: var(--primary); }
    .about-popup p { color: var(--grey); }
    .about-popup button {
      margin-top: 15px;
      padding: 9px 24px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 500;
      font-size: 1rem;
    }
    .about-popup button:hover { background: #4c2c7f; }

    .overlay {
      display: none;
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.3);
      z-index: 1000;
    }

    @keyframes fadeInUp {
      from {opacity:0; transform: translateY(26px);}
      to {opacity:1; transform: translateY(0);}
    }
    @media (max-width: 600px) {
      .container { max-width: 98vw; padding: 18px 4vw 16px 4vw; }
      .about-popup { width: 90vw; padding: 18px 6vw; }
      .theme-switcher { top:8px; right:8px; font-size:1rem; padding: 6px 13px;}
    }
  </style>
</head>
<body>
  <button class="theme-switcher" id="themeBtn" title="Toggle light/dark mode" onclick="toggleTheme()">
    <i class="fas fa-moon" id="themeIcon"></i> Theme
  </button>
  <div class="container">
    <h2>Settings</h2>
    <a href="notification.html" class="setting-option">
      <i class="fas fa-bell"></i><span>Notifications</span>
    </a>
    <a href="help.html" class="setting-option">
      <i class="fas fa-question-circle"></i><span>Help & Support</span>
    </a>
    <button class="setting-option" onclick="showAbout()">
      <i class="fas fa-info-circle"></i><span>About</span>
    </button>
    <div class="back-btn" onclick="goBack()">← Back to Home</div>
  </div>
  <!-- About Popup -->
  <div class="overlay" id="overlay"></div>
  <div class="about-popup" id="aboutPopup">
    <h3>About Prerna</h3>
    <p><strong>Version:</strong> 1.0</p>
    <p>Prerna is a space for kids to feel better, relax, and grow emotionally strong.</p>
    <button onclick="closeAbout()">Close</button>
  </div>
  <script>
    // --- Theme Switcher ----
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('prerna-theme', theme);
      document.getElementById('themeIcon').className =
        theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }
    function toggleTheme() {
      const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(theme);
    }
    // Set saved or OS theme on load
    (function() {
      const saved = localStorage.getItem('prerna-theme');
      if(saved) setTheme(saved);
      else if(window.matchMedia('(prefers-color-scheme: dark)').matches) setTheme('dark');
      else setTheme('light');
    })();

    function goBack() {
      window.location.href = "index.html";
    }
    function showAbout() {
      document.getElementById("aboutPopup").style.display = "block";
      document.getElementById("overlay").style.display = "block";
    }
    function closeAbout() {
      document.getElementById("aboutPopup").style.display = "none";
      document.getElementById("overlay").style.display = "none";
    }
    // Close about popup if overlay clicked
    document.getElementById("overlay").onclick = closeAbout;
  </script>
</body>
</html>
